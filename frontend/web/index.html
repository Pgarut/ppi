<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sistem Informasi Manajemen Madrasah PPI - Absensi, Jadwal, Nilai, dan Lainnya">
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1B5E20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MA Persis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SEO Meta Tags -->
  <meta name="application-name" content="MA Persis">
  <meta name="msapplication-TileColor" content="#1B5E20">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MA PERSIS GARUT</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Loading indicator styles */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1B5E20;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-spinner {
      text-align: center;
    }
    .loading-spinner::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner">
      <div>Memuat aplikasi...</div>
    </div>
  </div>
  
  <script>
    // Hide loading when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading')?.remove();
    });

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('ServiceWorker registered with scope:', registration.scope);
          })
          .catch(function(error) {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }

    // Handle offline/online status
    window.addEventListener('online', function() {
      document.title = 'MA PERSIS GARUT';
    });
    
    window.addEventListener('offline', function() {
      document.title = '[Offline] MA Persis';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
