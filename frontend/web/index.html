<!DOCTYPE html>
<html lang="id">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sistem Informasi MA Persis Garut - Absensi, Jadwal, Nilai, dan Lainnya">
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1B5E20">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MA Persis">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SEO Meta Tags -->
  <meta name="application-name" content="MA Persis">
  <meta name="msapplication-TileColor" content="#1B5E20">
  <meta name="msapplication-TileImage" content="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MA PERSIS GARUT</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    /* Loading indicator styles */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #2E7D32;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading-spinner {
      text-align: center;
    }
    .loading-spinner::after {
      content: '';
      display: block;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Update notification styles */
    .update-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1B5E20;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 100%); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .update-toast button {
      background: white;
      color: #1B5E20;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .update-toast button:hover {
      background: #E8F5E9;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-spinner">
      <div>Memuat aplikasi...</div>
    </div>
  </div>
  
  <script>
    // Hide loading when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading')?.remove();
    });

    // Fallback: jika Flutter gagal load dalam 15 detik, sembunyikan loading
    // dan tampilkan pesan error yang lebih jelas
    setTimeout(function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.innerHTML = '<div class="loading-spinner" style="text-align:center;">'
          + '<div style="font-size:48px;margin-bottom:16px;">⚠️</div>'
          + '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">Gagal memuat aplikasi</div>'
          + '<div style="font-size:13px;opacity:0.7;margin-bottom:16px;">Periksa koneksi internet dan coba lagi</div>'
          + '<button onclick="window.location.reload()" style="background:white;color:#2E7D32;border:none;padding:10px 24px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px;">Muat Ulang</button>'
          + '</div>';
      }
    }, 15000);

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(registration) {
            console.log('ServiceWorker registered with scope:', registration.scope);
          })
          .catch(function(error) {
            console.log('ServiceWorker registration failed:', error);
          });
      });
    }

    // Handle offline/online status
    window.addEventListener('online', function() {
      document.title = 'MA PERSIS GARUT';
    });
    
    window.addEventListener('offline', function() {
      document.title = '[Offline] MA Persis';
    });

    // Handle PWA update notification
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'UPDATE_AVAILABLE') {
          showUpdateNotification();
        }
      });
    }

    function showUpdateNotification() {
      // Remove existing toast if any
      const existing = document.querySelector('.update-toast');
      if (existing) existing.remove();

      // Create toast notification
      const toast = document.createElement('div');
      toast.className = 'update-toast';
      toast.innerHTML = '<span style="margin-right:8px;">🔄 Update tersedia!</span>'
        + '<button onclick="reloadApp()" style="background:white;color:#1B5E20;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;">Muat Ulang</button>';
      document.body.appendChild(toast);
    }

    function reloadApp() {
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
      }
      window.location.reload();
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
