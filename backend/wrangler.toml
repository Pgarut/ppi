name = "ppi-backend"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database (Dev)
[[d1_databases]]
binding = "DB"
database_name = "ppi-db"
database_id = ""
preview_database_id = ""

# Variables (dev default)
[vars]
JWT_SECRET = "ppi-madrasah-dev-secret-key-2026"
JWT_REFRESH_SECRET = "ppi-madrasah-refresh-secret-key-2026"
JWT_EXPIRES_IN = "8h"
CORS_ORIGIN = "*"

# Dev environment
[env.dev]
vars = { JWT_SECRET = "ppi-madrasah-dev-secret-key-2026", JWT_REFRESH_SECRET = "ppi-madrasah-refresh-secret-key-2026", JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "*" }

# Production environment
[env.production]
vars = { JWT_SECRET = "ppi-madrasah-prod-secret-2026", JWT_REFRESH_SECRET = "ppi-madrasah-refresh-prod-secret-2026", JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "https://ppi-bo8.pages.dev" }

# D1 Database (Production)
[[env.production.d1_databases]]
binding = "DB"
database_name = "ppi-db-prod"
database_id = "f4f8e08d-1d77-4cd4-8021-225e88ae233c"

# D1 migrations
[[migrations]]
tag = "v1"
