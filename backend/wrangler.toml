name = "ppi-backend"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database (Production)
[[d1_databases]]
binding = "DB"
database_name = "ppi-db-prod"
database_id = "f4f8e08d-1d77-4cd4-8021-225e88ae233c"

# Variables (dev default)
# JWT_SECRET & JWT_REFRESH_SECRET di-inject dari environment (bukan hardcode di repo).
#   * Production: nilai diambil dari GitHub Secrets JWT_SECRET / JWT_REFRESH_SECRET
#     yang diteruskan sebagai process env saat `wrangler deploy`, lalu dibind via
#     syntax {VAR} di bawah (wrangler akan membaca dari environment).
#   * Development lokal: wrangler otomatis membaca dari file .dev.vars di folder ini.
# Alternatif (lebih aman, terenkripsi): pakai `npx wrangler secret put JWT_SECRET`.
[vars]
JWT_EXPIRES_IN = "8h"
CORS_ORIGIN = "*"
JWT_SECRET = "{JWT_SECRET}"
JWT_REFRESH_SECRET = "{JWT_REFRESH_SECRET}"

# Dev environment
[env.dev]
vars = { JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "*" }

# Staging environment (untuk testing pre-production)
# Setup awal:
#   npx wrangler d1 create ppi-db-staging
#   npx wrangler d1 migrations apply ppi-db-staging
#   npx wrangler d1 execute ppi-db-staging --remote --file=src/db/seed.sql
[env.staging]
vars = { JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "*" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ppi-db-staging"
database_id = ""  # ← ISI: jalankan 'npx wrangler d1 create ppi-db-staging', copy ID nya ke sini

# Production environment
[env.production]
vars = { JWT_EXPIRES_IN = "8h", CORS_ORIGIN = "https://ppi-bo8.pages.dev,https://f1198d05.ppi-bo8.pages.dev", JWT_SECRET = "{JWT_SECRET}", JWT_REFRESH_SECRET = "{JWT_REFRESH_SECRET}" }

# D1 Database (Production)
[[env.production.d1_databases]]
binding = "DB"
database_name = "ppi-db-prod"
database_id = "f4f8e08d-1d77-4cd4-8021-225e88ae233c"

# D1 migrations
[[migrations]]
tag = "v1"

[[migrations]]
tag = "v2"

[[migrations]]
tag = "v3"

[[migrations]]
tag = "v4"

[[migrations]]
tag = "v5"
